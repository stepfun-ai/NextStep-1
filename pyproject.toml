[build-system]
requires = ["setuptools>=60.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextstep"
version = "0.0.1"
readme = "README.md"
dependencies = [
  # Deep learning frameworks
  "torch",
  "torchvision",
  "torchaudio",
  "deepspeed==0.16.3",
  "transformers>=4.49.0",
  "diffusers",
  # Data processing
  "numpy==1.26.4",
  "pandas",
  "webdataset",
  "megfile",
  # Configuration management
  "hydra-core==1.3.2",
  "omegaconf",
  "PyYAML",
  "dacite",
  # Logging and monitoring
  "loguru",
  "wandb",
  "tensorboard",
  # Utility libraries
  "huggingface-hub",
  "joblib",
  "requests",
  "tqdm",
  "Pillow",
  # Time handling
  "pendulum",
  "pytz",
  "schedule",
  # Development and debugging tools
  "black",
  "debugpy",
  "pyinstrument",
  "viztracer",
  # UI and interaction
  "streamlit",
  "fire",
  "tabulate",
  "Pygments",
  "colorama",
  # System utilities
  "psutil",
]
[project.scripts]
smartrun = "nextstep:smartrun"
gen_meta = "nextstep:gen_meta"
warmup_data = "nextstep:warmup_data"
eshow = "nextstep:_compare"
singlegpu_debug = "nextstep:singlegpu_debug"
multigpu_debug = "nextstep:multigpu_debug"


[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 128
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 128
